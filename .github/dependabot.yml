# Monthly dependency check (1st of each month). Opens PRs only; never merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: npm
    directory: "/princetires"
    schedule:
      interval: monthly
      timezone: America/Edmonton
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: America/Edmonton
